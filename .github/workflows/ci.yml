name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 applications components conftest.py
      - name: Component unit tests
        run: pytest components -v
      - name: Application integration tests
        run: pytest applications -v
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t park-lens .
      - name: Smoke test container
        run: |
          docker run -d --name park-lens -p 8000:8000 park-lens
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs park-lens
          exit 1
